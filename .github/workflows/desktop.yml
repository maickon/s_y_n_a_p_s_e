name: Desktop (Tauri)
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
jobs:
  build:
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest   # Apple Silicon
          - os: macos-15-intel # Intel
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env: # whisper.cpp portátil (sem -march=native do runner)
      GGML_NATIVE: 'OFF'
      GGML_AVX: ${{ matrix.os == 'macos-latest' && 'OFF' || 'ON' }}
      GGML_AVX2: ${{ matrix.os == 'macos-latest' && 'OFF' || 'ON' }}
      GGML_FMA: ${{ matrix.os == 'macos-latest' && 'OFF' || 'ON' }}
      GGML_F16C: ${{ matrix.os == 'macos-latest' && 'OFF' || 'ON' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - run: npm ci
        working-directory: desktop
      - name: Compilar (erros viram anotações)
        shell: bash
        working-directory: desktop
        run: |
          npm run copy
          cargo build --release --manifest-path src-tauri/Cargo.toml 2>&1 | tee b.log; s=${PIPESTATUS[0]}
          [ $s -eq 0 ] || { grep -E "error|Error|failed|fatal" b.log | tail -25 | sed 's/^/::error::/'; exit $s; }
      - uses: tauri-apps/tauri-action@v0
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        with:
          projectPath: desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'desktop-dev' }}
          releaseName: 'S.Y.N.A.P.S.E Desktop ${{ startsWith(github.ref, ''refs/tags/'') && github.ref_name || ''(dev)'' }}'
          releaseDraft: true
          prerelease: true

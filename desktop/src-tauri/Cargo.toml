[package]
name = "synapse"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
ureq = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
tar = "0.4"
flate2 = "1"
